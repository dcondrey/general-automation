<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <base target="_top">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    :root{font:14px/1.5 Arial,sans-serif;color:#18263e;background:#f6f8fb;--green:#176b62;--muted:#586780;--line:#dce3ed}
    *{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:7px;padding:9px 14px;background:white;color:#18263e;font-weight:600}button:hover{background:#edf3f5}button:disabled{opacity:.5;cursor:wait}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #50bfb2;outline-offset:2px}.primary{background:var(--green);border-color:var(--green);color:white}.primary:hover{background:#10574f}.quiet{background:transparent}.shell{display:grid;grid-template-columns:178px 1fr;min-height:100vh}aside{background:#15213d;color:white;padding:24px 14px;display:flex;flex-direction:column;gap:24px}.brand{font-size:16px;font-weight:700;padding:0 10px}.brand small{display:block;font-size:11px;font-weight:400;color:#b7c7db;letter-spacing:.04em}nav{display:grid;gap:6px}nav button{text-align:left;color:#c8d5e6;border:0;background:transparent;font-weight:400}nav button[aria-current=page]{background:#294461;color:white;font-weight:700}.aside-note{margin-top:auto;font-size:11px;color:#bccbdb;padding:10px}main{padding:24px 28px;min-width:0}header{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:18px}h1{font-size:25px;line-height:1.2;margin:0 0 6px}h2{font-size:17px;margin:0 0 12px}h3{font-size:15px;margin:0}p{margin:6px 0 14px}.muted,small{color:var(--muted)}.badge{background:#dff3ed;color:#145047;font-weight:700;font-size:11px;border-radius:4px;padding:4px 8px;white-space:nowrap}.notice{border:1px solid #c8dfd9;background:#edf8f4;padding:10px 13px;border-radius:7px;margin-bottom:16px}.notice.warn{border-color:#ecd2a2;background:#fff6e5;color:#784f10}.notice.error{border-color:#e8b5ae;background:#fff1ef;color:#953624}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}.metric,.card{background:white;border:1px solid var(--line);border-radius:9px;padding:16px}.metric strong{display:block;font-size:25px;line-height:1.3;margin-top:4px}.metric span{font-size:12px;color:var(--muted)}.stack{display:grid;gap:12px}.card .top,.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.card p{font-size:13px;margin:10px 0}.card footer{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px}.amount{font-size:17px;font-weight:700;white-space:nowrap}.tag{font-size:11px;background:#eef2f8;color:#41516c;border-radius:4px;padding:3px 6px}.tag.overdue{color:#953624;background:#fff1ef}.fields{display:grid;grid-template-columns:1fr 1fr;gap:13px 16px}.wide{grid-column:1/-1}label{display:block;font-weight:600;font-size:12px}label small{font-weight:400;display:block;margin-top:3px}input,select,textarea{width:100%;border:1px solid #b9c5d5;background:white;border-radius:6px;padding:9px 10px;color:#18263e;margin-top:5px}textarea{min-height:76px;resize:vertical}input[type=checkbox]{width:auto;margin:0 8px 0 0}.check{font-size:13px;display:flex;align-items:flex-start;font-weight:400}.actions{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}.steps{display:flex;gap:14px;margin:18px 0 22px;font-size:12px;color:var(--muted)}.steps strong{color:var(--green)}details{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}summary{cursor:pointer;font-size:13px;color:var(--green);font-weight:600}details .fields{margin-top:14px}.empty{padding:28px;text-align:center;background:white;border:1px dashed #b9c5d5;border-radius:8px}.dept{display:grid;grid-template-columns:160px 1fr 75px;align-items:center;gap:10px;font-size:12px;margin:10px 0}.bar{height:7px;background:#e8edf4;border-radius:4px;overflow:hidden}.bar div{background:#24877b;height:100%}.section{margin-top:26px}.filter{max-width:300px;margin:0 0 16px}#message:empty{display:none}[hidden]{display:none!important}.preview{margin-top:18px;background:#edf8f4;border:1px solid #c8dfd9;border-radius:8px;padding:16px}.history{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}.history p{font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}.loading{padding:60px 20px;text-align:center}.context{border-left:3px solid var(--green);padding:4px 12px;margin-bottom:20px}.context p{margin:3px 0;font-size:12px}@media(max-width:720px){.shell{grid-template-columns:130px 1fr}main{padding:20px 16px}.metrics,.fields{grid-template-columns:1fr}.wide{grid-column:auto}.dept{grid-template-columns:120px 1fr 60px}}
  </style>
</head>
<body>
  <div class="shell">
    <aside>
      <div class="brand">General Automation<small>DISCOVERY WORKSPACE</small></div>
      <nav aria-label="Workspace">
        <button data-view="overview" aria-current="page">Overview</button>
        <button data-view="add">Add a process</button>
        <button data-view="plan">Action plan</button>
        <button data-view="measure">Measure results</button>
      </nav>
      <div class="aside-note">Your workbook remains the source of truth. Nothing here sends messages or creates external tasks.</div>
      <button id="reload" class="quiet" style="color:white">Refresh workspace</button>
    </aside>
    <main>
      <header><div><h1 id="heading">Find your next improvement</h1><div id="subtitle" class="muted">Understand the work. Choose a next step. Measure the result.</div></div><div><span id="mode" class="badge">LOADING</span><select id="source" aria-label="Data source"><option value="Demo">Demo examples</option><option value="My backlog">My work</option></select></div></header>
      <div id="message" role="status" aria-live="polite"></div>
      <div id="content" aria-busy="true"><div class="loading">Reading your workbook…</div></div>
    </main>
  </div>
  <script>
    'use strict';
    let state=null,view='overview',busy=false,addStep=0,saveId=crypto.randomUUID(),preview=null,selected=null,operationId=null;
    const $=id=>document.getElementById(id);
    const titles={overview:'Find your next improvement',add:'Describe one process',plan:'Turn a priority into a next step',measure:'Record what actually changed'};
    const descriptions={overview:'A short list of work worth removing, redesigning, or automating.',add:'Answer a few questions. See the estimate before saving anything.',plan:'Give the work a clear next action and a date.',measure:'Keep observations and evidence separate from estimates.'};
    const hours=n=>n===null?'Not estimated':Number(n).toFixed(1)+' h/week';
    const node=(tag,text,className)=>{const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(className)e.className=className;return e;};
    function button(text,handler,primary=false){const e=node('button',text,primary?'primary':'');e.type='button';e.onclick=handler;return e;}
    function message(text,type='notice'){const area=$('message');area.replaceChildren();if(text)area.append(node('div',text,'notice '+type));}
    function setBusy(value){busy=value;document.querySelectorAll('button,input,select,textarea').forEach(e=>e.disabled=value);$('content').setAttribute('aria-busy',String(value));}
    function request(action,payload,onSuccess){if(busy)return;setBusy(true);google.script.run.withSuccessHandler(result=>{setBusy(false);if(!result.ok){message(result.error,'error');return;}onSuccess(result.data);}).withFailureHandler(()=>{setBusy(false);message('The connection was interrupted. Keep this window open and retry the same save; retries will not create a second process or measurement.','error');}).workspaceRequest(action,payload);}
    function reload(){request('load',{},data=>{state=data;selected=null;render();});}
    function go(next){if(busy)return;view=next;selected=null;message('');render();}
    function syncNavigation(){$('heading').textContent=titles[view];$('subtitle').textContent=descriptions[view];$('mode').textContent=state.demo?'DEMO · FICTIONAL DATA':'YOUR WORK';$('source').value=state.demo?'Demo':'My backlog';document.querySelectorAll('[data-view]').forEach(e=>{if(e.dataset.view===view)e.setAttribute('aria-current','page');else e.removeAttribute('aria-current');});}
    function render(){if(!state)return;syncNavigation();const root=$('content');root.replaceChildren();if(state.demo)root.append(node('div',view==='add'?'The example is a preview. Saving a new process adds it to your real Backlog and selects your data.':'Practice data is selected. Plans and measurements here belong only to the fictional demo.','notice'));if(view==='overview')overview(root);if(view==='add')addForm(root);if(view==='plan')planList(root);if(view==='measure')measureList(root);root.setAttribute('aria-busy','false');}
    function metrics(root){const wrap=node('div',undefined,'metrics');[['Recorded baseline',hours(state.baseline)],['Potential still to reclaim',hours(state.potential)],['Measured so far',state.measured===null?'Not measured':hours(state.measured)]].forEach(([label,value])=>{const e=node('div',undefined,'metric');e.append(node('span',label),node('strong',value));wrap.append(e);});root.append(wrap);}
    function empty(root,text,action){const e=node('div',undefined,'empty');e.append(node('p',text));if(action)e.append(button('Add a process',()=>go('add'),true));root.append(e);}
    function itemCard(item,action){const card=node('article',undefined,'card'),top=node('div',undefined,'top');top.append(node('h3',item.process),node('span',hours(item.potential),'amount'));card.append(top,node('small',item.department+' · '+item.owner),node('p',item.reason));const footer=node('footer');footer.append(node('span',item.action,'tag'));if(item.payback!==null)footer.append(node('span',item.effort+'h effort · '+item.payback.toFixed(1)+' weeks to pay back','muted'));if(item.plan.next)footer.append(node('span','Next step saved','tag'));if(action)footer.append(button('Plan next step',()=>editPlan(item),true));card.append(footer);return card;}
    function overview(root){metrics(root);if(state.issueCount)root.append(node('div',state.issueCount+' rows need attention and are excluded. Fix their source rows in the workbook, then refresh.','notice warn'));if(state.pendingMeasurements)root.append(node('div',state.pendingMeasurements+' interrupted measurements need review in Savings history before another result is recorded.','notice warn'));root.append(node('h2','Start with these three'));const top=state.items.filter(i=>i.potential>0&&!['Live','Paused'].includes(i.status)).slice(0,3);if(!top.length)empty(root,'No unlaunched opportunities with positive estimated savings yet.',true);else{const stack=node('div',undefined,'stack');top.forEach(i=>stack.append(itemCard(i,true)));root.append(stack);}if(state.departments.length){const section=node('section',undefined,'section');section.append(node('h2','Where the remaining opportunity sits'));const max=Math.max(1,...state.departments.map(d=>d.potential));state.departments.sort((a,b)=>b.potential-a.potential).forEach(d=>{const row=node('div',undefined,'dept'),bar=node('div',undefined,'bar'),fill=node('div');fill.style.width=(d.potential/max*100)+'%';bar.append(fill);row.append(node('span',d.name),bar,node('strong',d.potential.toFixed(1)+' h/wk'));section.append(row);});root.append(section);}root.append(node('p','Potential is an estimate after upkeep. Live and Paused work is excluded from remaining opportunity. Measured results are current observations, never a sum of repeated measurements.','muted section'));}
    const draft={department:'',process:'',owner:'',runs:'',minutes:'',needed:'',redesign:'',people:'',share:'',effort:'',upkeep:'',notes:'',errorRate:'',rework:'',overlap:''};
    function field(form,key,label,config={}){const wrap=node('label',label,config.wide?'wide':''),input=document.createElement(config.options?'select':config.multiline?'textarea':'input');input.id='field-'+key;input.name=key;if(config.options){const placeholder=node('option','Choose…');placeholder.value='';input.append(placeholder);config.options.forEach(v=>{const opt=node('option',v);opt.value=v;input.append(opt);});}else{if(!config.multiline)input.type=config.type||'text';if(config.type==='number'){input.min=String(config.min??0);input.max=String(config.max??100000);input.step='any';}else input.maxLength=config.maxLength||160;}input.required=config.required!==false;input.value=draft[key]??'';input.oninput=()=>{draft[key]=input.value;preview=null;};wrap.append(input);if(config.help)wrap.append(node('small',config.help));form.append(wrap);return input;}
    function addForm(root){const steps=node('div',undefined,'steps');['1 · Describe it','2 · Understand it','3 · Review & save'].forEach((text,i)=>steps.append(node(i===addStep?'strong':'span',text)));root.append(steps);const form=node('form'),fields=node('div',undefined,'fields');form.append(fields);
      if(addStep===0){field(fields,'department','Which team does this work?',{maxLength:100});field(fields,'owner','Who can verify the process?',{maxLength:100});field(fields,'process','What repetitive process are you describing?',{wide:true,help:'For example: reconcile inventory exports. Describe one process, not a whole department.'});field(fields,'runs','How often each week?',{type:'number',help:'Use 0.25 for once every four weeks.'});field(fields,'minutes','Minutes per person, each time',{type:'number',max:10080});}
      if(addStep===1){field(fields,'needed','Does someone need the output?',{options:['Yes','No','Unsure'],help:'No suggests retiring the work. Unsure means investigate first.'});field(fields,'redesign','Should the steps be simplified first?',{options:['Yes','No','Unsure']});const details=node('details',undefined,'wide');details.append(node('summary','Refine the estimate (optional)'));const extra=node('div',undefined,'fields');field(extra,'people','People participating each time',{type:'number',min:1,max:10000,required:false,help:'Blank assumes one person.'});field(extra,'share','Percent of effort removable',{type:'number',max:100,required:false,help:'Blank assumes 80%; use zero to keep manual.'});field(extra,'effort','Implementation and training hours',{type:'number',min:.01,required:false,help:'Blank uses the workbook default.'});field(extra,'upkeep','Ongoing upkeep, minutes/week',{type:'number',max:10080,required:false,help:'Deducted from the estimated saving.'});field(extra,'errorRate','Percent of runs needing rework',{type:'number',max:100,required:false});field(extra,'rework','Team minutes per failed run',{type:'number',max:10080,required:false});field(extra,'overlap','Shared baseline / overlap group',{maxLength:100,required:false,wide:true,help:'Use the same name for processes counting the same staff time. Collisions are withheld until reconciled.'});field(extra,'notes','Dependencies or context',{multiline:true,wide:true,maxLength:1000,required:false});details.append(extra);fields.append(details);}
      if(addStep===2&&preview){const p=node('div',undefined,'preview');p.append(node('h2',preview.action+': '+draft.process),node('p',preview.reason));const grid=node('div',undefined,'metrics');[['Current effort',hours(preview.baseline)],['Net potential',hours(preview.potential)],['Implementation',preview.effort+' hours']].forEach(([label,value])=>{const e=node('div');e.append(node('small',label),node('h3',value));grid.append(e);});p.append(grid);if(preview.payback!==null)p.append(node('p','Estimated payback: '+preview.payback.toFixed(1)+' weeks.'));if(preview.assumptions)p.append(node('p',preview.assumptions,'muted'));p.append(node('p','Saving creates one row in your Backlog and selects your own data. No Form, Doc, notification, or external task is created.','muted'));form.append(p);}
      const actions=node('div',undefined,'actions');if(addStep>0)actions.append(button('Back',()=>{addStep--;addFormReplace();}));const submit=node('button',addStep===2?'Save to my Backlog':addStep===1?'Preview recommendation':'Continue','primary');submit.type='submit';actions.append(submit);if(addStep===0)actions.append(button('Try an inventory example',()=>{Object.assign(draft,{department:'Supply Chain',process:'Reconcile inventory exports',owner:'Supply chain lead',runs:'5',minutes:'45',people:'2',needed:'Yes',redesign:'No',share:'80',effort:'8',upkeep:'30',errorRate:'10',rework:'20',overlap:'',notes:'Example only. Replace with an observed baseline before making a business decision.'});addFormReplace();}));form.append(actions);form.onsubmit=e=>{e.preventDefault();if(!form.reportValidity())return;if(addStep===0){addStep=1;addFormReplace();}else if(addStep===1)request('preview',draft,data=>{preview=data;addStep=2;addFormReplace();});else request('add',{requestId:saveId,input:draft},data=>{saveId=crypto.randomUUID();Object.keys(draft).forEach(k=>draft[k]='');addStep=0;preview=null;afterSave(data,'overview');});};root.append(form);}
    function addFormReplace(){const root=$('content');root.replaceChildren();addForm(root);}
    function afterSave(data,next){if(data.state)state=data.state;view=next;selected=null;render();message(data.warning||data.message,data.warning?'warn':'notice');}
    function search(root,items,renderItems){const input=document.createElement('input');input.type='search';input.placeholder='Find a process or owner';input.setAttribute('aria-label','Find a process or owner');input.className='filter';const list=node('div',undefined,'stack'),count=node('p','','muted');count.setAttribute('role','status');const draw=()=>{list.replaceChildren();const q=input.value.toLowerCase(),matches=items.filter(i=>(i.process+' '+i.owner+' '+i.department).toLowerCase().includes(q));matches.slice(0,100).forEach(i=>list.append(renderItems(i)));count.textContent=matches.length>100?'Showing 100 of '+matches.length+' matches. Narrow the search to find another process.':matches.length+' matching processes.';};input.oninput=draw;root.append(input,count,list);draw();}
    function planList(root){const planned=state.items.filter(i=>i.plan.next),remaining=state.items.filter(i=>!i.plan.next&&!['Live','Paused'].includes(i.status));if(state.unresolvedPlans)root.append(node('div',state.unresolvedPlans+' saved plans refer to a missing or invalid source row. Review Action plan in the detailed workbook view.','notice warn'));if(!planned.length)root.append(node('p','Pick a process below, then give its owner a specific next step and a target date.','muted'));search(root,planned.concat(remaining),item=>{const card=itemCard(item,false);if(item.plan.next){card.append(node('p',item.plan.next));if(item.plan.due)card.append(node('span','Due '+item.plan.due,item.plan.due<state.today&&item.status!=='Live'?'tag overdue':'tag'));}card.append(button(item.plan.next?'Update next step':'Plan next step',()=>editPlan(item),!item.plan.next));return card;});if(!planned.length&&!remaining.length)empty(root,'Add a process to start a plan.',true);}
    function context(root,item){const e=node('div',undefined,'context');e.append(node('h3',item.process),node('p',item.department+' · Owner: '+item.owner),node('p','Baseline '+hours(item.baseline)+' · Status: '+item.status));root.append(e);}
    function editPlan(item){view='plan';selected=item;operationId=crypto.randomUUID();syncNavigation();$('heading').textContent='Make the next step specific';const root=$('content');root.replaceChildren();context(root,item);const form=node('form'),fields=node('div',undefined,'fields');const dueWrap=node('label','Target date (optional)'),due=document.createElement('input');due.type='date';due.value=item.plan.due;dueWrap.append(due);const nextWrap=node('label','What will the owner do next?','wide'),next=document.createElement('textarea');next.required=true;next.maxLength=500;next.value=item.plan.next||({Delete:'Confirm who needs the output, then retire the duplicate step.',Automate:'Verify the baseline and test a small version with the owner.','Redesign first':'Simplify the intake checklist with the people using it.',Investigate:'Find who uses the output and confirm whether the work is needed.','Keep manual':'Confirm the decision requires a person and document the reason.'}[item.action]);nextWrap.append(next);fields.append(dueWrap,nextWrap);form.append(fields);const actions=node('div',undefined,'actions'),submit=node('button','Save next step','primary');submit.type='submit';actions.append(submit,button('Cancel',()=>go('plan')));form.append(actions);form.onsubmit=e=>{e.preventDefault();if(form.reportValidity())request('plan',{requestId:operationId,ref:item.ref,due:due.value,next:next.value,revision:item.plan.revision},data=>afterSave(data,'plan'));};root.append(form);}
    function measureList(root){root.append(node('p','Record a weekly saving only after the change is live. Include the measurement window and how the number was checked. Blank means unmeasured; zero is a real result.','muted'));if(state.pendingMeasurements)root.append(node('div','An earlier measurement is Pending. Retry its original save if this window still has it; otherwise ask the owner to review Savings history before recording another result for that process.','notice warn'));if(state.pendingMeasurements){const held=node('div',undefined,'stack');state.pending.forEach(p=>{const card=node('article',undefined,'card');card.append(node('h3',p.process),node('p',p.date+' · '+hours(p.saved)),button('Finish interrupted save',()=>request('resume',{requestId:p.requestId},data=>afterSave(data,'measure')),true));held.append(card);});root.append(held);}search(root,state.items,item=>{const card=node('article',undefined,'card'),top=node('div',undefined,'top');top.append(node('h3',item.process),node('span',item.measured===null?'Not measured':hours(item.measured),'amount'));card.append(top,node('small',item.owner+' · Baseline '+hours(item.baseline)));card.append(button('Record observed result',()=>editMeasurement(item),true));return card;});if(!state.items.length)empty(root,'Add a process before recording a result.',true);if(state.history.length){const section=node('section',undefined,'section');section.append(node('h2','Latest measurement records'),node('p','Earlier observations stay here. They are never added together as extra weekly savings.','muted'));state.history.forEach(h=>{const e=node('article',undefined,'history');e.append(node('h3',h.process+' · '+hours(h.saved)),node('small',h.date),node('p',h.evidence));section.append(e);});root.append(section);}}
    function editMeasurement(item){view='measure';selected=item;operationId=crypto.randomUUID();syncNavigation();$('heading').textContent='Record an observed result';const root=$('content');root.replaceChildren();context(root,item);const form=node('form'),fields=node('div',undefined,'fields');const savedWrap=node('label','Observed hours saved each week'),saved=document.createElement('input');saved.type='number';saved.min='0';saved.max=String(item.baseline);saved.step='any';saved.required=true;const dateWrap=node('label','Measured on'),date=document.createElement('input');date.type='date';date.max=state.today;date.value=state.today;date.required=true;const evidenceWrap=node('label','What evidence supports this number?','wide'),evidence=document.createElement('textarea');evidence.required=true;evidence.maxLength=1000;evidence.placeholder='For example: compared the same report for two weeks before and after launch; owner reviewed the timings. Include ongoing upkeep.';savedWrap.append(saved);dateWrap.append(date);evidenceWrap.append(evidence);const checkWrap=node('label',undefined,'check wide'),check=document.createElement('input');check.type='checkbox';check.required=true;checkWrap.append(check,document.createTextNode('This change is live. These are observed savings, including ongoing upkeep, rather than a forecast.'));fields.append(savedWrap,dateWrap,evidenceWrap,checkWrap);form.append(fields);const actions=node('div',undefined,'actions'),submit=node('button','Record result','primary');submit.type='submit';actions.append(submit,button('Cancel',()=>go('measure')));form.append(actions);form.onsubmit=e=>{e.preventDefault();if(form.reportValidity())request('measure',{requestId:operationId,ref:item.ref,date:date.value,saved:saved.value,evidence:evidence.value,confirmed:check.checked},data=>afterSave(data,'measure'));};root.append(form);}
    document.querySelectorAll('[data-view]').forEach(e=>e.onclick=()=>go(e.dataset.view));$('reload').onclick=reload;$('source').onchange=()=>request('source',{source:$('source').value},data=>afterSave(data,'overview'));reload();
  </script>
</body>
</html>
